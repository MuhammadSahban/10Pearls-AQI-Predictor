name: Training pipeline (daily)

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-b2.txt

      - name: Run training pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
        run: python src/training_pipeline.py

      - name: Generate SHAP feature-importance plots
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
        run: python src/shap_analysis.py

      # These PNGs are small and are what the dashboard's "Feature
      # importance" panel displays -> commit them regardless of which
      # backend is used for the heavier model/feature artifacts.
      - name: Commit SHAP plots
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add local_store/shap_*.png
          git diff --cached --quiet || git commit -m "chore: update SHAP plots [skip ci]"
          git push

      # Only relevant when using neither Hopsworks nor B2: persist
      # local_store/ (joblib models, metrics) back into the repo.
      - name: Commit updated models
        if: ${{ !secrets.HOPSWORKS_API_KEY && !secrets.B2_KEY_ID }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add local_store/
          git diff --cached --quiet || git commit -m "chore: retrain models [skip ci]"
          git push
