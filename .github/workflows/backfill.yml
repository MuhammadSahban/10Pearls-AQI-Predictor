name: Backfill historical data (manual, one-time)

# No schedule -- this only ever runs when you trigger it yourself from
# the Actions tab. Meant to be run once to seed deep history before
# your first real training run; safe to re-run later if you ever want
# to extend the history further back.

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2025-08-01"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-08-01"

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUD_BACKEND: ${{ secrets.HOPSWORKS_API_KEY != '' || secrets.B2_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run backfill
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
        run: >
          python src/backfill_historical.py
          --start "${{ inputs.start_date }}"
          --end "${{ inputs.end_date }}"

      # Only relevant if neither B2 nor Hopsworks is configured.
      - name: Commit local artifacts (fallback mode only)
        if: ${{ env.HAS_CLOUD_BACKEND != 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f local_store/
          git diff --cached --quiet || git commit -m "chore: backfill historical features [skip ci]"
          git push
